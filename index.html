<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test N Reverse 1999</title>
    <style>
        /* 基礎重置與排版設定 */
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            color: #1a1a1a;
        }

        /* 網頁主容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #ffffff;
            min-height: 100vh;
        }

        /* 頂部 Header 設計 (包含鏡像反轉文字) */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .logo-text {
            font-size: 24px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .logo-mirrored {
            transform: rotate(180deg);
        }

        /* 副標題說明區塊 */
        .sub-header {
            margin-bottom: 40px;
        }
        .sub-header h2 {
            font-size: 16px;
            font-weight: bold;
            margin: 0 0 4px 0;
        }
        .sub-header p {
            font-size: 13px;
            color: #666;
            margin: 0;
        }

        /* 卡片網格系統 (響應式設計的核心) */
        .card-grid {
            display: grid;
            /* 自動適應寬度，最小寬度為 280px，剩餘空間均分 */
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }

        /* 單一卡片樣式 */
        .card {
            background: #ffffff;
            border: 1px solid #f0f0f0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        /* 卡片圖片容器 */
        .card-image {
            width: 100%;
            aspect-ratio: 1 / 1; /* 保持圖片為正方形比例 */
            object-fit: cover;
            display: block;
        }

        /* 卡片內文區塊 */
        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }
        .card-title {
            font-size: 15px;
            font-weight: bold;
            line-height: 1.5;
            margin: 0 0 15px 0;
        }
        .card-title a {
            color: inherit;
            text-decoration: none;
            transition: color 0.2s;
        }
        .card-title a:hover {
            color: #588062; /* 懸停時略帶綠色 */
            text-decoration: underline;
        }
        .card-subtitle {
            font-size: 13px;
            color: #666;
            margin-top: 4px;
            font-weight: normal;
            display: block;
        }

        /* 行動呼籲按鈕文字 */
        .call-to-action {
            font-size: 13px;
            font-weight: 600;
            color: #1a1a1a;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            margin-top: auto; /* 將按鈕推至底部 */
        }
        .call-to-action:hover {
            text-decoration: underline;
        }

        /* 底部版權/開發者區塊 */
        .footer {
            margin-top: 60px;
            display: flex;
            justify-content: center;
        }
        .developer-badge {
            background-color: #f4f4f4;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 12px;
            color: #555;
            font-weight: 500;
        }

        /* 手機版字體微調 */
        @media (max-width: 600px) {
            .logo-text {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
